 {% load static %}

<html lang="en">

    <title>{% block title %}Task Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'todo/css/style.css' %}">
</head>

<body>

    <script src="{% static 'todo/js/app.js' %}" defer></script>
</body>

</html>
